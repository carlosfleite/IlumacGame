<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-label="Ilumaquinho decepcionado — deu ruim">
  <!-- Ilumaquinho — variante "errou": olhos caídos, boca pra baixo,
       braços murchos e chama do extintor apagada. -->
  
  <g stroke="#141414" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- antenas caídas -->
    <path d="M156 46 L180 34" stroke-width="13" stroke="#43474e"/>
    <path d="M176 52 L200 46" stroke-width="11" stroke="#43474e"/>
    <!-- alça -->
    <path d="M84 48 A20 20 0 1 1 62 74" fill="none" stroke="#8a9098" stroke-width="9"/>

    <!-- braços caídos -->
    <path d="M52 108 q-18 10 -18 32 l0 30 q0 12 12 12" fill="none" stroke="#3f434a" stroke-width="20"/>
    <path d="M188 108 q18 10 18 32 l0 30 q0 12 -12 12" fill="none" stroke="#3f434a" stroke-width="20"/>

    <!-- pernas -->
    <rect x="82" y="196" width="26" height="34" fill="#33363d"/>
    <rect x="132" y="196" width="26" height="34" fill="#33363d"/>
    <path d="M74 228 h42 v28 q0 10 -12 10 H74 q-8 0 -8 -9 z" fill="#9c1720"/>
    <path d="M124 228 h42 v29 q0 9 -8 9 h-22 q-12 0 -12 -10 z" fill="#9c1720"/>

    <!-- corpo octogonal -->
    <path d="M76 40 h88 l36 36 v88 l-36 36 h-88 l-36 -36 v-88 z" fill="#9c1720"/>
    <path d="M88 58 h64 l26 26 v56 l-26 26 h-64 l-26 -26 v-56 z" fill="none" stroke="#5e0a10" stroke-width="3"/>

    <!-- olhos caídos (pálpebra pesada) -->
    <path d="M78 100 q20 -14 40 0 q0 20 -20 20 t-20 -20 z" fill="#f2f1ed" stroke-width="3.5"/>
    <path d="M122 100 q20 -14 40 0 q0 20 -20 20 t-20 -20 z" fill="#f2f1ed" stroke-width="3.5"/>
    <path d="M74 92 l46 6" stroke="#141414" stroke-width="5"/>
    <path d="M166 92 l-46 6" stroke="#141414" stroke-width="5"/>

    <!-- boca pra baixo -->
    <path d="M84 166 q36 -30 72 0 q-36 -14 -72 0 z" fill="#f2f1ed" stroke-width="4"/>

    <!-- queixo / painel -->
    <path d="M84 178 h72 v12 q0 10 -12 10 h-48 q-12 0 -12 -10 z" fill="#5e0a10"/>

    <!-- extintor com a chama apagada (fumacinha) -->
    <rect x="24" y="186" width="34" height="56" rx="9" fill="#9c1720"/>
    <path d="M41 186 v-10" stroke="#8a9098" stroke-width="6"/>
    <path d="M36 176 h18" stroke="#8a9098" stroke-width="6"/>
    <path d="M41 210 q-6 -8 0 -14 q7 6 2 14 z" fill="#5c5f66" stroke-width="2.5"/>

    <!-- chave inglesa -->
    <path d="M198 196 a13 13 0 1 0 0 26 a13 13 0 1 0 0 -26 z" fill="none" stroke="#8a9098" stroke-width="8"/>

    <!-- selo ILUMAC -->
    <g transform="rotate(-16 174 158)">
      <rect x="150" y="148" width="48" height="19" rx="3" fill="#5e0a10" stroke-width="3"/>
      <text x="174" y="162" text-anchor="middle" fill="#f2f1ed" stroke="none"
            font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700"
            letter-spacing="0.5">ILUMAC</text>
    </g>
  </g>
</svg>
