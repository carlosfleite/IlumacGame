<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ranking — Quiz SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-ranking" data-kiosk-timeout="45">
  <div class="screen screen-ranking">
    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
      <span class="tag tag-live">Ao vivo</span>
    </div>

    <main class="palco palco-ranking">
      <header class="brand-header brand-header--linha">
        <div>
          <p class="brand-eyebrow">Fire Show 2026 · Stand D73/D124</p>
          <h1 class="brand-title">Ranking</h1>
        </div>
        <div class="ranking-tabs" role="tablist">
          <button type="button" class="ranking-tab is-ativa" id="tab-dia" role="tab" aria-selected="true">Hoje</button>
          <button type="button" class="ranking-tab" id="tab-geral" role="tab" aria-selected="false">3 dias</button>
        </div>
      </header>

      <div class="ranking-podio" id="ranking-podio"></div>

      <div class="ranking-wrap">
        <ol class="ranking-lista" id="ranking-lista">
          <li class="ranking-vazio">Carregando…</li>
        </ol>
      </div>
    </main>

    <footer class="rodape">
      <a class="btn btn-primary btn-block" href="/" id="btn-reiniciar">Novo jogador</a>
    </footer>
  </div>
  <script src="/static/js/kiosk.js"></script>
  <script src="/static/js/ranking.js"></script>
</body>
</html>
