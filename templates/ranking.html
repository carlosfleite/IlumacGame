<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ranking — Quiz SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-ranking" data-kiosk-timeout="45">
  <!-- Pranchetas 2 (ranking geral, com pódio) e 3 (ranking do dia) -->
  <main class="tela tela--ranking">
    <h1 class="px tela-titulo rk-titulo">Ranking</h1>

    <div role="tablist">
      <button type="button" class="px ranking-tab is-ativa" id="tab-dia" role="tab" aria-selected="true">Ranking do dia</button>
      <button type="button" class="px ranking-tab" id="tab-geral" role="tab" aria-selected="false">Ranking geral (3 dias)</button>
    </div>

    <div class="ranking-podio" id="ranking-podio" hidden></div>

    <ol class="ranking-lista" id="ranking-lista">
      <li class="ranking-vazio">Carregando…</li>
    </ol>

    <!-- Não existe no mockup: sem ele, quem chega depois fica preso no
         ranking até o aviso de inatividade. -->
    <a class="btn-px forma-contorno rk-novo" href="/" id="btn-reiniciar">Novo participante</a>
  </main>
  <script src="/static/js/kiosk.js"></script>
  <script src="/static/js/ranking.js"></script>
</body>
</html>
