<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cadastro — Quiz SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-cadastro" data-kiosk-timeout="90">
  <!-- Pranchetas 4 (sem teclado) e 5 (com teclado) do mockup -->
  <main class="tela tela--cadastro">
    <h1 class="px tela-titulo cad-titulo">Cadastro</h1>
    <p class="cad-sub">Seus dados entram no ranking<br>e valem o prêmio no stand.</p>

    <form id="form-cadastro" novalidate>
      <label class="campo" id="campo-nome">
        <span class="sr">Nome completo</span>
        <input type="text" name="nome" id="nome" required autocomplete="name"
               enterkeyhint="next" placeholder="Digite seu nome"
               autocapitalize="words" maxlength="80">
        <span class="dica" id="dica-nome" hidden></span>
      </label>

      <label class="campo" id="campo-email">
        <span class="sr">E-mail</span>
        <!-- type=text, não email: o formulário já é novalidate (validação
             de verdade é JS/servidor, não a nativa do navegador), e em
             type=email o Chromium nem expõe selectionStart — o toque no
             meio do endereço pra apagar uma letra sempre caía no fim. -->
        <input type="text" name="email" id="email" required autocomplete="email"
               enterkeyhint="next" inputmode="email" placeholder="seuemail@exemplo.com"
               autocapitalize="off" spellcheck="false" maxlength="120">
        <span class="dica" id="dica-email" hidden></span>
      </label>

      <label class="campo" id="campo-telefone">
        <span class="sr">Telefone</span>
        <input type="tel" name="telefone" id="telefone" required autocomplete="tel"
               enterkeyhint="done" inputmode="numeric" placeholder="(00) 00000-0000"
               maxlength="15">
        <span class="dica" id="dica-telefone" hidden></span>
      </label>

      <label class="cad-lgpd">
        <input type="checkbox" name="consentimento_lgpd" id="consentimento_lgpd" required>
        <span class="cad-lgpd-texto">
          Li e concordo com o uso dos meus dados pessoais pela Ilumac para fins do Desafio
          de Instalação no Fire Show 2026 (cadastro, cronometragem, exibição no ranking do
          estande e contato sobre o resultado), conforme a Lei Geral de Proteção de Dados (LGPD).
        </span>
      </label>

      <img class="mascote cad-mascote" src="/static/img/mockup/mascote.svg" alt="">
      <div class="cad-balao" aria-live="polite">
        <p id="erro-cadastro" class="form-error" hidden></p>
        <p class="balao-convite"><b>Pronto para o desafio?</b>Complete os dados e comece a rodada</p>
      </div>

      <button type="submit" class="btn-px forma-escura cad-continuar" id="btn-cadastrar">Continuar</button>
    </form>
  </main>

  <script src="/static/js/kiosk.js"></script>
  <script src="/static/js/cadastro.js"></script>
  <script src="/static/js/teclado.js"></script>
  <script src="/static/js/easter-eggs.js"></script>
</body>
</html>
