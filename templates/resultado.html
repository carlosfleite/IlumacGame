<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Resultado — Quiz SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-resultado" data-kiosk-timeout="60">
  <!-- Prancheta 7 do mockup -->
  <main class="tela tela--resultado">
    <p class="px res-rotulo">Quiz finalizado</p>
    <h1 class="px res-nome" id="resultado-nome">—</h1>

    <img class="mascote res-mascote" src="/static/img/mockup/mascote.svg" alt="">
    <p class="px res-pontos" id="resultado-pontos">0</p>
    <p class="px res-de">de 10</p>

    <div class="res-premio">
      <p class="px res-premio-nome" id="resultado-premio">—</p>
      <p class="res-premio-desc" id="resultado-premio-desc"></p>
    </div>

    <p class="px res-tempo-rotulo">Seu tempo</p>
    <p class="px res-tempo" id="resultado-tempo">00:00<small>.00</small></p>

    <a class="btn-px forma-escura res-ranking" href="/ranking">Ver ranking</a>
    <a class="btn-px forma-contorno res-novo" href="/" id="btn-novo">Novo participante</a>
  </main>

  <script src="/static/js/kiosk.js"></script>
  <script>
    (function () {
      var raw = sessionStorage.getItem("ultimo_resultado");
      if (!raw) {
        window.location.replace("/");
        return;
      }
      var r;
      try { r = JSON.parse(raw); } catch (e) {
        window.location.replace("/");
        return;
      }

      // 00:05.54 — minutos:segundos e centésimos menores, como no mockup
      function pintarTempo(el, ms) {
        ms = Math.max(0, Math.round(ms || 0));
        var cs = Math.floor(ms / 10) % 100;
        var s = Math.floor(ms / 1000);
        var m = Math.floor(s / 60);
        s = s % 60;
        el.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        var small = document.createElement("small");
        small.textContent = "." + (cs < 10 ? "0" : "") + cs;
        el.appendChild(small);
      }

      var elPontos = document.getElementById("resultado-pontos");
      var pontos = String(r.pontuacao);
      elPontos.textContent = pontos;
      elPontos.classList.toggle("dois-digitos", pontos.length > 1);

      var elNome = document.getElementById("resultado-nome");
      elNome.textContent = r.nome || "Participante";
      document.getElementById("resultado-premio").textContent =
        (r.premio && r.premio.nome) ? r.premio.nome : "Sem prêmio";
      document.getElementById("resultado-premio-desc").textContent =
        (r.premio && r.premio.descricao) ? r.premio.descricao : "";
      pintarTempo(document.getElementById("resultado-tempo"), r.tempo_total_ms);

      caberNaLinha(elNome);
      caberNaLinha(document.getElementById("resultado-premio"));

      document.getElementById("btn-novo").addEventListener("click", function () {
        sessionStorage.removeItem("participante_id");
        sessionStorage.removeItem("ultimo_resultado");
      });
    })();
  </script>
</body>
</html>
