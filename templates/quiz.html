<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz — SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-quiz" data-kiosk-timeout="120">
  <div class="screen screen-quiz">
    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
      <!-- Cronômetro compacto: a base da tela agora é da barra de fogo -->
      <div class="timer-topo" aria-live="off">
        <span class="rotulo">Tempo</span>
        <span class="valor" id="quiz-timer">00:00</span>
      </div>
    </div>

    <div class="quiz-meta">
      <span id="quiz-progresso">Pergunta 1 / 5</span>
      <span id="quiz-pontos">0 pts</span>
    </div>

    <section class="quiz-corpo" id="quiz-corpo">
      <h2 class="quiz-pergunta" id="quiz-pergunta">Carregando…</h2>
      <div class="quiz-alternativas" id="quiz-alternativas" role="group" aria-label="Alternativas"></div>
    </section>
  </div>

  <!-- Barra de fogo: um bloco por pergunta. Acende no acerto, apaga no erro. -->
  <footer class="barra-fogo">
    <div class="barra-info">
      <div class="barra-rotulo">
        <span>Nível de fogo</span>
        <b id="barra-placar">0 / 10</b>
      </div>
      <div class="barra-trilho" id="barra-trilho" role="img" aria-label="Progresso da partida"></div>
    </div>
    <div class="chama-caixa">
      <div class="chama" id="chama" data-nivel="0" aria-hidden="true"></div>
    </div>
  </footer>

  <!-- Feedback: o Llumaquinho entra puxando o card pela corda -->
  <div id="feedback-overlay" class="feedback-overlay" hidden>
    <div class="fb-reboque" id="fb-reboque">
      <div class="fb-card" id="fb-card">
        <div class="fb-faixa" id="fb-faixa"></div>
        <div class="fb-corpo">
          <p id="feedback-msg" class="feedback-msg"></p>
          <p id="feedback-pontos" class="feedback-pontos"></p>
          <p class="feedback-tap">Toque para continuar</p>
        </div>
      </div>
      <span class="fb-corda" aria-hidden="true"></span>
      <div class="fb-mascote" id="fb-mascote" role="img" aria-label="Llumaquinho"></div>
    </div>
  </div>

  <script src="/static/js/kiosk.js"></script>
  <script src="/static/js/quiz.js"></script>
</body>
</html>
