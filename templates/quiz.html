<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz — SDAI Ilumac</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-quiz" data-kiosk-timeout="120">
  <!-- A tela da pergunta não tem prancheta no mockup: usa o fundo do
       "Como jogar" e as mesmas peças (selo numerado, cartão branco). -->
  <main class="tela tela--quiz">
    <div class="px quiz-meta">
      <span id="quiz-progresso">Pergunta 1 / 5</span>
      <span id="quiz-pontos">0 pts</span>
    </div>

    <h2 class="quiz-pergunta" id="quiz-pergunta">Carregando…</h2>

    <div class="quiz-alternativas" id="quiz-alternativas" role="group" aria-label="Alternativas"></div>

    <!-- Cronômetro da pergunta: a barra drena com os segundos. Zerou, a
         pergunta conta como errada. A chama cresce a cada acerto. -->
    <div class="barra-fogo">
      <div class="barra-info">
        <div class="barra-rotulo">
          <span>Tempo</span>
          <b id="barra-prazo">0:20</b>
        </div>
        <div class="barra-trilho" role="img" aria-label="Tempo restante da pergunta">
          <div class="barra-progresso" id="barra-progresso"></div>
        </div>
      </div>
      <div class="chama-caixa">
        <div class="chama" id="chama" data-nivel="0" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Feedback: pranchetas 8 (acerto, fundo verde) e 9 (erro) -->
    <div id="feedback-overlay" class="feedback-overlay" hidden>
      <div class="fb-reboque" id="fb-reboque">
        <!-- setas (acerto) e X (erro) do mockup, animados pelo CSS -->
        <div class="fb-deco" id="fb-deco" aria-hidden="true"></div>
        <div id="fb-card">
          <!-- Primeiro no DOM = fica por baixo dos outros elementos na
               pilha (nenhum tem z-index, então quem vem depois cobre
               quem vem antes). Puxa o toque pra qualquer área vazia da
               tela — topo, bordas, embaixo do mascote — sem cobrir a
               caixa de resposta, que fica por cima e "tampa" o botão
               bem ali, protegendo a leitura (ver comentário no CSS). -->
          <button type="button" class="px feedback-tap" id="feedback-continuar">Toque para continuar</button>

          <p id="feedback-msg" class="px feedback-msg"></p>
          <p id="feedback-pontos" class="px feedback-pontos"></p>

          <div class="fb-resposta">
            <p class="px fb-resposta-rotulo" id="fb-resposta-rotulo">Resposta</p>
            <p class="fb-resposta-texto" id="feedback-detalhe"></p>
          </div>

          <img class="mascote fb-mascote" id="fb-mascote" src="/static/img/mockup/mascote.svg" alt="">
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/kiosk.js"></script>
  <script src="/static/js/deco-mockup.js"></script>
  <script src="/static/js/quiz.js"></script>
</body>
</html>
