<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz SDAI — Ilumac Fire Show 2026</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-abertura">
  <div class="screen screen-abertura">
    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
      <img class="selo-ilumagame" src="/static/img/ilumagame.png" alt="Iluma Game">
    </div>

    <div class="abertura-corpo">
      <p class="brand-eyebrow abertura-eyebrow">Fire Show 2026 · Stand D73/D124</p>
      <h1 class="brand-title abertura-titulo">Quiz SDAI</h1>
      <p class="brand-sub abertura-sub">Teste o que você sabe sobre detecção e alarme de incêndio</p>

      <div class="abertura-palco">
        <img class="abertura-estrela abertura-estrela-1" src="/static/img/estrela.png" alt="" aria-hidden="true">
        <img class="abertura-estrela abertura-estrela-2" src="/static/img/estrela.png" alt="" aria-hidden="true">
        <img class="abertura-balao" src="/static/img/balao-fogos.png" alt="" aria-hidden="true">
        <div class="abertura-mascote sprite" role="img" aria-label="Llumaquinho acenando"></div>
      </div>
    </div>

    <div class="abertura-cta">
      <img class="abertura-seta" src="/static/img/seta.png" alt="" aria-hidden="true">
      <a class="btn btn-primary btn-block abertura-btn" href="/cadastro">
        Toque para começar
      </a>
    </div>
  </div>

  <script src="/static/js/kiosk.js"></script>
</body>
</html>
