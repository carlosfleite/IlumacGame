<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz SDAI — Ilumac Fire Show 2026</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-abertura">
  <div class="screen screen-abertura">

    <!-- Moldura de produtos Ilumac em pixel: so a linha atual. Camada
         atras do conteudo, produtos espalhados pelas bordas. Decoracao. -->
    <div class="produtos" aria-hidden="true">
      <img class="prod prod-eixo prod-tl" src="/static/img/produtos/acionador.png" alt="">
      <img class="prod prod-tr" src="/static/img/produtos/sirene-bell.png" alt="">
      <img class="prod prod-eixo prod-bl" src="/static/img/produtos/sirene-strobe.png" alt="">

      <img class="prod prod-clara prod-t1" src="/static/img/produtos/detector-fumaca.png" alt="">
      <img class="prod prod-clara prod-t2" src="/static/img/produtos/isolador.png" alt="">

      <img class="prod prod-esc prod-l1" src="/static/img/produtos/central-kedual.png" alt="">
      <img class="prod prod-clara prod-l2" src="/static/img/produtos/detector-termico.png" alt="">
      <img class="prod prod-esc prod-r1" src="/static/img/produtos/central-lyax.png" alt="">
      <img class="prod prod-clara prod-r2" src="/static/img/produtos/modulo-saida.png" alt="">

      <img class="prod prod-clara prod-br" src="/static/img/produtos/detector-linear.png" alt="">
    </div>

    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
      <span class="tag tag-stand">Stand D73 / D124</span>
    </div>

    <main class="palco palco-abertura">
      <div class="abertura-hero">
        <p class="abertura-eyebrow">Fire Show 2026</p>
        <img class="abertura-imagem" src="/static/img/logo-ilumacgame.png" alt="Iluma Game — Quiz SDAI">
        <h1 class="abertura-titulo">Quiz SDAI</h1>
        <p class="abertura-sub">Teste o que você sabe sobre detecção e alarme de incêndio</p>
      </div>

      <!-- Faixa de números: enche a faixa morta entre o herói e os botões
           com a informação que decide o participante a jogar. -->
      <ul class="abertura-numeros">
        <li><b>5</b><span>perguntas</span></li>
        <li><b>10</b><span>pontos</span></li>
        <li><b>2min</b><span>de jogo</span></li>
      </ul>
    </main>

    <footer class="rodape rodape-abertura">
      <a class="abertura-btn abertura-btn--jogar" href="/cadastro">
        <img src="/static/img/BotaoBeje.png" alt="Jogar" class="abertura-btn-img">
      </a>

      <a class="abertura-btn abertura-btn--ranking" href="/ranking">
        <img src="/static/img/BotaoVinho.png" alt="Ranking" class="abertura-btn-img">
      </a>
    </footer>
  </div>

  <script src="/static/js/kiosk.js"></script>
</body>
</html>
