<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz SDAI — Ilumac Fire Show 2026</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-abertura">
  <div class="screen screen-abertura">
    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
    </div>

    <div class="abertura-corpo">
      <p class="brand-eyebrow abertura-eyebrow">Fire Show 2026 · Stand D73/D124</p>
      <img class="abertura-imagem" src="/static/img/IlumaGameNovo.png" alt="Ilumagame" aria-hidden="true">
      <h1 class="brand-title abertura-titulo">Quiz SDAI</h1>
      <p class="brand-eyebrow abertura-eyebrow">Teste o que você sabe sobre detecção<br>e alarme de incêndio.</p>
    </div>

    <div class="abertura-botoes">
      <span class="estrela estrela-1" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>
      <span class="estrela estrela-2" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>
      <span class="estrela estrela-3" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>
      <span class="estrela estrela-4" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>
      <span class="estrela estrela-5" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>
      <span class="estrela estrela-6" aria-hidden="true"><img src="/static/img/estrela.png" alt="" class="estrela-img"></span>

      <a class="abertura-btn abertura-btn--jogar" href="/cadastro">
        <img src="/static/img/BotaoBeje.png" alt="Jogar" class="abertura-btn-img">
      </a>

      <a class="abertura-btn abertura-btn--ranking" href="/ranking">
        <img src="/static/img/BotaoVinho.png" alt="Ranking" class="abertura-btn-img">
      </a>
    </div>
  </div>

  <script src="/static/js/kiosk.js"></script>
</body>
</html>
