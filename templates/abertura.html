<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quiz SDAI — Ilumac Fire Show 2026</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-abertura">
  <div class="screen screen-abertura">

    <div class="topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="/static/img/logo-ilumac-branco.svg" alt="Ilumac">
        <span class="brand-divider" aria-hidden="true"></span>
        <img class="brand-logo-fs" src="/static/img/logo-fireshow-branco.png" alt="Fire Show 2026">
      </div>
      <span class="tag tag-stand">Stand D73 / D124</span>
    </div>

    <main class="palco palco-abertura">
      <div class="abertura-hero">
        <p class="abertura-eyebrow">Fire Show 2026</p>
        <img class="abertura-imagem" src="/static/img/logo-ilumacgame.png" alt="Iluma Game — Quiz SDAI">
        <h1 class="abertura-titulo">Quiz<br>Tudo sobre SDAI</h1>
        <p class="abertura-sub">Teste o que você sabe sobre e ganhe brindes</p>
      </div>
    </main>

    <footer class="rodape rodape-abertura">
      <a class="abertura-btn abertura-btn--jogar" href="/cadastro">
        <img src="/static/img/BotaoBeje.png" alt="Jogar" class="abertura-btn-img">
      </a>
    </footer>
  </div>

  <script src="/static/js/kiosk.js"></script>
</body>
</html>
